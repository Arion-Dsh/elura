name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Verify release
        run: make verify
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          retry_publish() {
            package="$1"
            for attempt in $(seq 1 12); do
              if output="$(cargo publish --color never -p "$package" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              printf '%s\n' "$output"
              if [[ "$output" == *"already exists on crates.io index"* ]]; then
                echo "$package is already published; continuing"
                return 0
              fi
              if [ "$attempt" -eq 12 ]; then
                return 1
              fi
              sleep 10
            done
          }
          retry_publish elura-core
          retry_publish elura-runtime
          retry_publish elura-gateway
          retry_publish elura-world
          retry_publish elura-room
          retry_publish elura-aoi
          retry_publish elura-simulation
          retry_publish elura-netcode
          retry_publish elura-replication
          retry_publish elura-lag-compensation
          retry_publish elura-net-sim
          retry_publish elura-monolith
          retry_publish elura-adapters
          retry_publish elura-providers
          retry_publish elura
          retry_publish elura-cli
