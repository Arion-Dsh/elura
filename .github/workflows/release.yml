name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Verify release
        run: make verify
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          retry_publish() {
            package="$1"
            for attempt in $(seq 1 12); do
              if cargo publish -p "$package"; then
                return 0
              fi
              if [ "$attempt" -eq 12 ]; then
                return 1
              fi
              sleep 10
            done
          }
          retry_publish elura-core
          retry_publish elura-runtime
          retry_publish elura-gateway
          retry_publish elura-world
          retry_publish elura-monolith
          retry_publish elura-adapters
          retry_publish elura-providers
          retry_publish elura
          retry_publish elura-cli
