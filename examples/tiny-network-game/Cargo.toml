[package]
name = "elura-spot-demo"
version = "0.3.1"
edition = "2024"
publish = false

[workspace]
resolver = "3"
exclude = ["sdk/rust"]

[dependencies]
elura = { path = "../../crates/elura", features = [
    "monolith",
    "simulation",
    "netcode",
    "replication",
    "lag-compensation",
    "net-sim",
] }
elura-client = { path = "sdk/rust/crates/elura-client" }
prost = "0.14.4"
spottedcat = "1.0.2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
