[package]
name = "elura-client"
workspace = "../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Official high-level Rust client SDK for Elura"
documentation = "https://docs.rs/elura-client"
readme = "README.md"
keywords = ["elura", "gamedev", "client", "networking"]
categories = ["game-development", "network-programming"]

[dependencies]
bytes.workspace = true
elura-protocol = { version = "0.2.10", path = "../elura-protocol", features = ["tokio-codec"] }
futures-util.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "client"
harness = false
