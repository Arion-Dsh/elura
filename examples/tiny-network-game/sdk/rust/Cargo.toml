[workspace]
resolver = "3"
members = [
    "crates/elura-protocol",
    "crates/elura-client",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://elura.rustyspottedcat.dev/"
repository = "https://github.com/Arion-Dsh/elura-sdk-rust"
authors = ["Elura Contributors"]

[workspace.dependencies]
bytes = "1.12.1"
criterion = { version = "0.7.0", features = ["async_tokio"] }
futures-util = { version = "0.3.32", features = ["sink"] }
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
