[package]
name = "elura-protocol"
version = "{{ELURA_VERSION}}"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Standalone Rust client implementation of the Elura ELR2 protocol"

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio-util = { version = "0.7.18", features = ["codec"] }
