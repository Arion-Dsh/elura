[package]
name = "elura-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "../../README.md"
homepage.workspace = true
repository.workspace = true
description = "Client-facing Gateway runtime for Elura"
documentation = "https://docs.rs/elura-gateway"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
identity-http = ["dep:elura-providers", "elura-providers/identity"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
elura-core.workspace = true
elura-providers = { workspace = true, optional = true, default-features = false }
elura-runtime.workspace = true
futures-util.workspace = true
ipnet.workspace = true
quinn.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
wtransport.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
tower.workspace = true
wtransport = { workspace = true, features = ["dangerous-configuration"] }
