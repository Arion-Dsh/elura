[workspace]
resolver = "3"
members = [
    "crates/elura",
    "crates/elura-core",
    "crates/elura-runtime",
    "crates/elura-gateway",
    "crates/elura-world",
    "crates/elura-monolith",
    "crates/elura-providers",
    "crates/elura-adapters",
    "tools/elura-cli",
    "tools/elura-load",
    "tools/elura-perf",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
authors = ["Elura Contributors"]
readme = "README.md"

[workspace.dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
bytes = { version = "1.12.0", features = ["serde"] }
cbc = { version = "0.1.2", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
criterion = "0.7"
futures-util = { version = "0.3.32", features = ["sink"] }
hex = "0.4.3"
hmac = "0.12.1"
http = "1.4.0"
elura-core = { version = "0.2.0", path = "crates/elura-core" }
elura-runtime = { version = "0.2.0", path = "crates/elura-runtime" }
elura-gateway = { version = "0.2.0", path = "crates/elura-gateway" }
elura-world = { version = "0.2.0", path = "crates/elura-world" }
elura-monolith = { version = "0.2.0", path = "crates/elura-monolith" }
elura-adapters = { version = "0.2.0", path = "crates/elura-adapters", default-features = false }
elura-providers = { version = "0.2.0", path = "crates/elura-providers", default-features = false }
md-5 = "0.10.6"
ipnet = "2"
prost = "0.14.3"
k8s-openapi = { version = "0.26", features = ["v1_32"] }
kube = { version = "2", default-features = false, features = ["client", "runtime", "rustls-tls"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9.2"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "cluster-async"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
rustls-pemfile = "2"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha1 = "0.10.6"
sha2 = { version = "0.10.9", features = ["oid"] }
socket2 = "0.6.5"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "uuid", "json"] }
subtle = "2.6.1"
tokio = { version = "1.52.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-opentelemetry = "0.32"
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
webpki-roots = "1.0.8"
x509-parser = { version = "0.18", features = ["verify"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
